name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.19.0"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"
      - run: bun install --frozen-lockfile
      - run: bun run verify
      - name: Pack the CLI
        run: |
          mkdir -p artifact
          cd cli
          npm pack --pack-destination ../artifact
          cd ..
          tar -xzf artifact/mh-stack-*.tgz -C artifact
      - name: Install the packed runtime dependency
        working-directory: artifact/package
        run: npm install --omit=dev --ignore-scripts
      - name: Artifact smoke
        env:
          MH_STACK_TEMPLATES_DIR: ${{ github.workspace }}/artifact/package/templates
          MH_STACK_CLI_ENTRY: ${{ github.workspace }}/artifact/package/dist/index.js
        run: bun test cli/test
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mh_stack
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d mh_stack"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/mh_stack
      MH_REQUIRE_POSTGRES: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.19.0"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"
      - run: bun install --frozen-lockfile
      - name: Run the postgres twins
        working-directory: server
        run: |
          set -o pipefail
          bun test 2>&1 | tee pg-tests.log
      - name: Assert the full suite passed with no skips
        working-directory: server
        run: |
          ! grep -Eq '^ *[1-9][0-9]* fail' pg-tests.log
          ! grep -Eq '^ *[1-9][0-9]* skip' pg-tests.log
      - name: Assert the postgres files were collected with their own counts
        working-directory: server
        run: |
          bun test test/notes-postgres.test.ts test/hosting-postgres.test.ts test/client-dist-postgres.test.ts \
            --reporter=junit --reporter-outfile=pg-collected.xml
          grep -q 'testsuites name="bun test" tests="17"' pg-collected.xml
          grep -q '<testsuite name="test/notes-postgres.test.ts" [^>]*tests="9"' pg-collected.xml
          grep -q '<testsuite name="test/hosting-postgres.test.ts" [^>]*tests="7"' pg-collected.xml
          grep -q '<testsuite name="test/client-dist-postgres.test.ts" [^>]*tests="1"' pg-collected.xml
          ! grep -q 'skipped="[1-9]' pg-collected.xml
      - name: Exercise the temporary-database failure paths and the 42501 classification
        working-directory: server
        run: |
          bun run test/test-database.probe.ts > pg-probe.log
          grep -q '^url-override current=mh_test_' pg-probe.log
          grep -q '^connect-denied rethrown=42501$' pg-probe.log
          grep -q '^creation-failure skip=null required=throw recorded=0$' pg-probe.log
          grep -q '^owned-names=[0-9][0-9]* remaining=0$' pg-probe.log
          ! grep -q '^skip:' pg-probe.log
  scaffold:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    strategy:
      fail-fast: false
      matrix:
        flavor: [react, angular]
        schema: [zod, effect]
        db: [sqlite, postgres]
    env:
      # Any existing database on the service supplies the server coordinates;
      # the scaffolded suites create and drop their own mh_test_* databases.
      DATABASE_URL: ${{ matrix.db == 'postgres' && 'postgres://postgres:postgres@localhost:5432/postgres' || '' }}
      MH_REQUIRE_POSTGRES: ${{ matrix.db == 'postgres' && '1' || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.19.0"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"
      - run: bun install --frozen-lockfile
      - name: Pack and extract the CLI
        run: |
          mkdir -p artifact
          cd cli
          npm pack --pack-destination ../artifact
          cd ..
          tar -xzf artifact/mh-stack-*.tgz -C artifact
      - name: Install the packed runtime dependency
        working-directory: artifact/package
        run: npm install --omit=dev --ignore-scripts
      - name: Scaffold
        working-directory: artifact/package
        run: node dist/index.js --${{ matrix.flavor }} --${{ matrix.schema }} --${{ matrix.db }} --name ci-app --no-install "${{ runner.temp }}/ci-app-${{ matrix.flavor }}-${{ matrix.schema }}-${{ matrix.db }}"
      - name: Install the scaffolded project
        working-directory: ${{ runner.temp }}/ci-app-${{ matrix.flavor }}-${{ matrix.schema }}-${{ matrix.db }}
        run: bun install
      - name: Assert bun.lock resolves the selected libraries
        working-directory: ${{ runner.temp }}/ci-app-${{ matrix.flavor }}-${{ matrix.schema }}-${{ matrix.db }}
        run: |
          grep -A8 '"shared": {' bun.lock | grep -q "\"${{ matrix.schema }}\":"
          if [ "${{ matrix.schema }}" = "zod" ]; then
            grep -q 'zod@3\.' bun.lock
          else
            grep -q 'effect@4\.1\.0' bun.lock
          fi
          if [ "${{ matrix.db }}" = "postgres" ]; then
            grep -q 'postgres@3\.4\.9' bun.lock
            ! grep -A8 '"shared": {' bun.lock | grep -q '"postgres":'
          else
            ! grep -q 'postgres@3\.' bun.lock
          fi
      - name: Verify the scaffolded project
        working-directory: ${{ runner.temp }}/ci-app-${{ matrix.flavor }}-${{ matrix.schema }}-${{ matrix.db }}
        run: bun run verify
  packed-smoke:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        flavor: [react, angular]
        schema: [zod, effect]
        db: [sqlite, postgres]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.19.0"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"
      - run: bun install --frozen-lockfile
      - name: Pack and extract the CLI
        run: |
          mkdir -p artifact
          cd cli
          npm pack --pack-destination ../artifact
          cd ..
          tar -xzf artifact/mh-stack-*.tgz -C artifact
      - name: Install the packed runtime dependency
        working-directory: artifact/package
        run: npm install --omit=dev --ignore-scripts
      - name: CLI suite against the packed artifact
        env:
          MH_STACK_TEMPLATES_DIR: ${{ github.workspace }}/artifact/package/templates
          MH_STACK_CLI_ENTRY: ${{ github.workspace }}/artifact/package/dist/index.js
        run: bun test cli/test
      - name: Scaffold
        working-directory: artifact/package
        run: node dist/index.js --${{ matrix.flavor }} --${{ matrix.schema }} --${{ matrix.db }} --name smoke-app --no-install "${{ runner.temp }}/smoke-app-${{ matrix.flavor }}-${{ matrix.schema }}-${{ matrix.db }}"
      - name: Install
        working-directory: ${{ runner.temp }}/smoke-app-${{ matrix.flavor }}-${{ matrix.schema }}-${{ matrix.db }}
        run: bun install
      - name: Lint, format and typecheck
        working-directory: ${{ runner.temp }}/smoke-app-${{ matrix.flavor }}-${{ matrix.schema }}-${{ matrix.db }}
        run: bun run check
      - name: Build
        working-directory: ${{ runner.temp }}/smoke-app-${{ matrix.flavor }}-${{ matrix.schema }}-${{ matrix.db }}
        run: bun run build
      - name: Tests and clean postgres skips
        working-directory: ${{ runner.temp }}/smoke-app-${{ matrix.flavor }}-${{ matrix.schema }}-${{ matrix.db }}
        env:
          DATABASE_URL: ""
          MH_REQUIRE_POSTGRES: ""
        run: |
          set -o pipefail
          bun run test 2>&1 | tee smoke-tests.log
          ! grep -Eq '^ *[1-9][0-9]* fail' smoke-tests.log
          if [ "${{ matrix.db }}" = "postgres" ]; then
            grep -Eq '^ *7 pass' smoke-tests.log
            # 17 gated tests + two skipped hooks per gated file.
            grep -Eq '^ *23 skip' smoke-tests.log
            ! grep -Eq '^ *[1-9][0-9]* fail' smoke-tests.log
          else
            grep -Eq '^ *24 pass' smoke-tests.log
            ! grep -Eq '^ *[1-9][0-9]* skip' smoke-tests.log
          fi
